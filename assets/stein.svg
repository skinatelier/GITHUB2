<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="weich" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="hauch" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="korn"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .38  0 0 0 0 .32  0 0 0 0 .26  0 0 0 .035 0"/></filter>
  </defs>
  <!-- weiche Wolken -->
  <g filter="url(#hauch)" fill="none" stroke-linecap="round">
    <path d="M-40 640 C 260 560, 520 610, 760 520 S 1240 380, 1660 300" stroke="#E9E0D3" stroke-width="60" opacity=".35"/>
    <path d="M-40 900 C 300 840, 640 880, 980 760 S 1400 640, 1660 600" stroke="#FFFFFF" stroke-width="80" opacity=".45"/>
  </g>
  <!-- feine Adern, kontrastarm -->
  <g filter="url(#weich)" fill="none" stroke-linecap="round">
    <path d="M-20 700 C 180 660, 300 690, 420 640 C 520 600, 560 560, 700 548 C 860 534, 980 470, 1120 430 C 1280 384, 1420 350, 1640 280" stroke="#D8CBB8" stroke-width="1.6" opacity=".55"/>
