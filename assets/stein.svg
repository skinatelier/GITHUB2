    <path d="M1120 430 C 1160 360, 1240 320, 1260 240 C 1276 180, 1330 120, 1400 60" stroke="#DCD0BF" stroke-width="1" opacity=".35"/>
    <path d="M-20 260 C 140 250, 260 210, 380 220 C 470 228, 520 200, 600 150" stroke="#E0D5C6" stroke-width="1" opacity=".3"/>
  </g>
  <rect width="100%" height="100%" filter="url(#korn)"/>
</svg>
